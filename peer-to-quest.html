<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer To Peer Quest</title>
  <link rel="icon" href="assets/svg/Logo-Peer-To-Peer-Quest.svg">
  <link rel="stylesheet" href="assets/css/output.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body class="bg-white">
  <section id="quest-section" class="py-24">
    <div class="max-w-[1240px] mx-auto px-6">

      <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-20">
        <div class="max-w-2xl">

          <div class="fixed top-10 left-10 z-50">
            <a href="index.html"
              class="flex items-center gap-3 text-black hover:scale-105 transition duration-300 font-semibold text-[18px]">
              <img src="assets/svg/arrow-back.svg" alt="Back" class="w-6 h-6">
              Kembali Ke Beranda
            </a>
          </div>
          <div class="inline-flex items-center bg-blue-600 px-6 py-2 rounded-full mb-6">
            <button class="flex gap-2 items-center text-[12px] font-semibold text-white">
              <span>
                <img src="assets/svg/people.svg" alt="">
              </span>
              Community Quest Myastudy
            </button>
          </div>
          <h2 class="text-4xl md:text-5xl font-semibold text-slate-900 tracking-tighter leading-tight">
            Bantu Teman, <br><span class="text-blue-600">Selesaikan Misi Belajar.</span>
          </h2>
        </div>

        <button id="btn-post-quest"
          class="bg-slate-900 text-white px-10 py-5 rounded-[18px] font-medium text-sm hover:scale-105 transition-all shadow-xl shadow-slate-200 flex items-center gap-3">
          <span>
            <img src="assets/svg/add.svg" alt="">
          </span>
          Posting Quest Baru
        </button>
      </div>

      <div id="quest-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        <div
          class="quest-card bg-white p-10 rounded-[22px] border-2 border-slate-50 shadow-sm hover:border-blue-600 hover:shadow-2xl hover:shadow-blue-100 transition-all duration-500">
          <div class="flex justify-between items-start mb-8">
            <span
              class="bg-blue-50 text-blue-600 text-[11px] font-black px-4 py-1.5 rounded-lg uppercase tracking-wider">Programming</span>
            <span class="text-slate-400 text-[12px] font-semibold">
              2 Jam Lalu
            </span>
          </div>

          <h4 class="text-2xl font-black text-slate-900 mb-4 tracking-tight">
            Belum Ngerti Tailwind CSS
          </h4>
          <p class="text-sm text-slate-500 mb-8 leading-relaxed font-medium">
            Udah ngerti CSS pengen belajar Tailwind CSS kira kira kalian ada yang
            bisa bantu ga alur belajar Tailwind CSS?</p>

          <div class="flex items-center justify-between pt-8 border-t border-slate-50">
            <div class="flex -space-x-3">
              <div
                class="w-10 h-10 rounded-full bg-blue-600 border-4 border-white flex items-center justify-center text-[10px] text-white font-bold">
                MA</div>
              <div
                class="w-10 h-10 rounded-full bg-amber-500 border-4 border-white flex items-center justify-center text-[10px] text-white font-bold">
                RD</div>
            </div>
            <button class="join-quest-btn text-blue-600 font-semibold text-sm hover:underline flex items-center">
              Ikut Diskusi
            </button>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/peer-to-peer-quest.js"></script>
</body>

</html>
