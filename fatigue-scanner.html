<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Fatigue Scanner</title>
  <link rel="icon" href="assets/svg/Logo-Digital-Fatigue-Scanner.svg">
  <link rel="stylesheet" href="assets/css/output.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <style>
    /* Mengelola state aktif pada opsi jawaban untuk UX yang lebih interaktif */
    .answer-opt.active {
      border-color: #2563eb;
      background-color: #eff6ff;
      ring: 4px;
      ring-color: #dbeafe;
    }
  </style>
</head>

<body
  class="bg-[#F1F5F9] min-h-screen flex flex-col items-center justify-center p-6 font-['Plus_Jakarta_Sans',_sans-serif]">

  <div class="fixed top-10 left-10 z-50">
    <a href="index.html"
      class="flex items-center gap-3 text-black hover:scale-105 transition duration-300 font-semibold text-[18px]">
      <img src="assets/svg/arrow-back.svg" alt="Back" class="w-6 h-6" loading="lazy">
      Kembali Ke Beranda
    </a>
  </div>

  <div class="w-full max-w-4xl bg-white rounded-[2rem] p-10 md:p-16 shadow-sm border border-slate-100">
    <div id="scanner-header" class="text-center">
      <h2 class="text-3xl md:text-4xl font-semibold text-slate-900 mb-8 tracking-tighter">
        Siap Memulai Diagnosa?
      </h2>
      <button id="btn-start-scan"
        class="flex mx-auto items-center justify-center gap-2 bg-blue-600 text-white px-10 py-4 rounded-2xl font-medium hover:bg-blue-700 transition-all shadow-lg shadow-blue-100">
        <span>
          <img src="assets/svg/tangan-white.svg" alt="" loading="lazy">
        </span>
        Mulai Sekarang
      </button>
    </div>

    <div id="quiz-area" class="hidden">
      <div class="w-full bg-slate-100 h-3 rounded-full mb-12 overflow-hidden border border-slate-50">
        <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-500 shadow-md"></div>
      </div>

      <h3 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-800 mb-10 tracking-tight">
        Menyiapkan pertanyaan...
      </h3>

      <div class="space-y-4 mb-12">
        <button
          class="answer-opt w-full p-6 rounded-2xl border-2 border-slate-100 text-left font-bold text-slate-700 hover:border-blue-400 hover:bg-slate-50 transition-all group flex justify-between items-center"
          data-score="1">
          Ya, sangat terasa
        </button>
        <button
          class="answer-opt w-full p-6 rounded-2xl border-2 border-slate-100 text-left font-bold text-slate-700 hover:border-blue-400 hover:bg-slate-50 transition-all group flex justify-between items-center"
          data-score="0">
          Tidak terlalu
        </button>
      </div>

      <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
        <button id="btn-prev"
          class="flex w-full md:w-auto items-center justify-center gap-2 bg-slate-100 text-slate-600 px-8 py-4 rounded-2xl font-medium hover:bg-slate-200 transition-all">
          <span>
            <img src="assets/svg/arrow-back.svg" alt="" loading="lazy">
          </span>
          Kembali
        </button>
        <button id="btn-next"
          class="flex w-full md:w-auto items-center justify-center gap-2 bg-blue-600 text-white px-8 py-4 rounded-2xl font-medium hover:bg-blue-700 transition-all opacity-50 cursor-not-allowed">
          Selanjutnya
        </button>
      </div>
    </div>
  </div>

  <div id="scan-result" style="display:none;"
    class="p-10 rounded-[22px] max-w-md text-center bg-white border border-slate-100">
    <div class="mb-6 flex justify-center">
      <div id="result-icon" class="text-7xl animate-bounce"></div>
    </div>
    <h3 id="result-title" class="text-2xl font-semibold text-slate-900 mb-3 tracking-tighter"></h3>
    <p id="result-desc" class="text-slate-500 text-sm leading-relaxed font-medium"></p>

    <button onclick="Fancybox.close()"
      class="mt-10 bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold text-sm w-full hover:bg-black transition-all shadow-xl shadow-slate-100">
      Oke, Mengerti
    </button>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script src="assets/js/fatigue-scanner.js"></script>
</body>

</html>
